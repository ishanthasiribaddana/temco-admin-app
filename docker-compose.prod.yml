# =============================================================================
# PRODUCTION OVERRIDES
# =============================================================================
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.prod.yml up -d
#
# Features:
# - Connects to HOST MariaDB (not containerized)
# - Frontend served via Nginx (static build)
# - No debug ports exposed
# - Localhost-only port bindings for security
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # WildFly - Production overrides
  # ---------------------------------------------------------------------------
  wildfly:
    container_name: admin-wildfly
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PASSWORD=${DB_PASSWORD}
      - WILDFLY_USER=${WILDFLY_USER:-admin}
      - WILDFLY_PASSWORD=${WILDFLY_PASSWORD:-admin123}
    ports:
      - "127.0.0.1:8088:8080"   # Localhost only
      - "127.0.0.1:9992:9990"   # Admin console localhost only
    volumes:
      - ./deployments:/opt/jboss/wildfly/standalone/deployments

  # ---------------------------------------------------------------------------
  # Frontend - Production Nginx (static files)
  # SSO handled via Nginx proxy to FinanceApp SSO API (port 8087)
  # ---------------------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: admin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./admin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VITE_SSO_API_URL=/api
    depends_on:
      - wildfly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - temco-network

  # ---------------------------------------------------------------------------
  # Redis - Production (no exposed ports)
  # ---------------------------------------------------------------------------
  redis:
    container_name: admin-redis
    # No ports exposed - internal only
