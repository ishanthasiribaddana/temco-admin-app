# =============================================================================
# LOCAL DEVELOPMENT OVERRIDES
# =============================================================================
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.local.yml up -d
#
# Features:
# - Includes MariaDB container (no need to install locally)
# - Includes phpMyAdmin for database management
# - Frontend runs in dev mode with hot reload
# - Debug ports exposed
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MariaDB Database (Local only - production uses host DB)
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.6
    container_name: temco-admin-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-6qZB6d@pIvj}
      MYSQL_DATABASE: temco_system
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d:ro
    networks:
      - temco-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-6qZB6d@pIvj}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # WildFly - Local overrides
  # ---------------------------------------------------------------------------
  wildfly:
    container_name: temco-admin-wildfly
    environment:
      - DB_HOST=mariadb
      - DB_PASSWORD=${DB_PASSWORD:-6qZB6d@pIvj}
    ports:
      - "127.0.0.1:8088:8080"    # AdminApp WildFly
      - "127.0.0.1:9990:9990"    # Admin console
      - "127.0.0.1:8788:8787"    # Debug port
    volumes:
      - ./Backend/target:/opt/jboss/wildfly/standalone/deployments
    depends_on:
      mariadb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend - Development mode with hot reload
  # ---------------------------------------------------------------------------
  frontend:
    image: node:18-alpine
    container_name: temco-admin-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:8088/temco-bank/api/v1
      - VITE_SSO_API_URL=http://localhost:8088/temco-bank/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - temco-network

  # ---------------------------------------------------------------------------
  # Redis - Local overrides
  # ---------------------------------------------------------------------------
  redis:
    container_name: temco-admin-redis
    ports:
      - "127.0.0.1:6379:6379"

  # ---------------------------------------------------------------------------
  # phpMyAdmin - Database UI (Local only)
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: temco-admin-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-6qZB6d@pIvj}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - mariadb
    networks:
      - temco-network

volumes:
  mariadb_data:
  frontend_node_modules:
